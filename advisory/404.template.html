<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
{{ROBOTS}}
<meta name="theme-color" content="#050505">
{{ICONS}}
<style>
{{FONT_FACES}}
/* The one page a mistyped link reaches: the same black, the same wordmark, one sentence in each
   language and the way back to each. No script at all. */
:root{--black:#050505;--on-dark:#f4f4f2;--on-dark-2:#9a9a97;--line-dark:#232326;--green:#67e18f;
  --sans:"Schibsted Grotesk", Arial, sans-serif;
  --gutter:max(clamp(20px, 5vw, 72px), env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px))}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--black);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--black);color:var(--on-dark);
  font-family:"Schibsted Grotesk",Arial,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--on-dark);color:var(--black)}
:focus-visible{outline:2px solid var(--on-dark);outline-offset:4px}
.wrap{width:100%;max-width:1360px;margin-inline:auto;padding-inline:var(--gutter)}
header .wrap{padding-block:calc(26px + env(safe-area-inset-top, 0px)) 26px}
.logo{display:inline-flex;text-decoration:none}
{{LOGO_CSS}}
main{flex:1;display:flex;align-items:flex-end}
main .wrap{padding-block:clamp(56px, 12vh, 140px) clamp(56px, 9vh, 104px)}
.kicker{font-family:"JetBrains Mono","Courier New",monospace;font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--on-dark-2);margin:0 0 28px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(2.125rem, 3.4vw + 1rem, 4.5rem);line-height:1.06;
  letter-spacing:-.022em;margin:0;max-width:13em;text-wrap:balance}
.other{font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:clamp(1.3125rem, .5vw + 1.15rem, 1.5625rem);line-height:1.45;
  color:var(--on-dark-2);margin:clamp(28px, 3vw, 44px) 0 0;padding-top:20px;border-top:1px solid var(--line-dark);max-width:18.9em}
.links{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:44px;font-family:"JetBrains Mono","Courier New",monospace;font-size:.6875rem;
  letter-spacing:.16em;text-transform:uppercase}
.links a{color:var(--on-dark);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;padding:6px 0}
footer .wrap{padding-block:0 calc(32px + env(safe-area-inset-bottom, 0px));
  font-family:"JetBrains Mono","Courier New",monospace;font-size:.6875rem;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-2)}
footer p{margin:0;padding-top:32px;border-top:1px solid var(--line-dark)}
/* phones held sideways and short screens: everything on one screen, as on the home page */
@media (orientation: landscape) and (max-height: 500px){
  header .wrap{padding-block:calc(14px + env(safe-area-inset-top, 0px)) 14px}
  main .wrap{padding-block:16px 24px}
  h1{font-size:clamp(1.625rem, 7.4svh, 2.25rem)}
  .kicker{margin-bottom:16px}
  .other{margin-top:14px;padding-top:12px;font-size:1.0625rem}
  .links{margin-top:20px}
  footer p{padding-top:16px}
  footer .wrap{padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
}
@media (max-height: 600px) and (orientation: portrait){main .wrap{padding-block:40px}}
@media (max-width: 520px){header .wrap{padding-block:calc(18px + env(safe-area-inset-top, 0px)) 18px}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="{{HOME_EN}}" aria-label="{{BRAND}}, home">{{WORDMARK}}</a></div></header>
<main>
  <div class="wrap">
    <p class="kicker">Error 404</p>
    <h1>This page does not exist.</h1>
    <p class="other" lang="es-ES">Esta página no existe.</p>
    <p class="links"><a href="{{HOME_EN}}">Back to the home page</a><a href="{{HOME_ES}}" lang="es-ES">Volver al inicio</a></p>
  </div>
</main>
<footer><div class="wrap"><p>{{COPYRIGHT}}</p></div></footer>
</body>
</html>
